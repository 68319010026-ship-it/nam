<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูเว็บไซต์</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* เมนูด้านบน */
        .navbar {
            position: fixed; /* ติดอยู่ด้านบน */
            top: 0;
            width: 100%;
            background-color: #333;
            overflow: hidden;
        }

        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #575757;
        }

        /* เนื้อหา */
        .content {
            padding-top: 60px; /* เว้นพื้นที่ให้เมนู */
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">หน้าแรก</a>
        <a href="#">เกี่ยวกับเรา</a>
        <a href="#">บริการ</a>
        <a href="#">ติดต่อ</a>
    </div>

    <div class="content">
        <h1>ยินดีต้อนรับสู่เว็บไซต์</h1>
        <p>ตัวอย่างเนื้อหาหน้าเว็บ</p>
    </div>

</body>
</html>
